<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/shabnam-font@v5.0.1/dist/font-face.css">
<link rel="stylesheet" href="../fonts/Vazirmatn-font-face.css" />
<title>سفارشات مشتریان</title>
<style>
body {
    margin: 0;
    font-family: "Vazirmatn", sans-serif;
    direction: rtl;
    min-height: 100vh;
    background: url('https://images.unsplash.com/photo-1506765515384-028b60a970df?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat fixed;
    color: #facc01e5;
    padding: 40px 20px;
    position: relative;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0, 0, 0, 0.644), rgba(0,0,0,0.85));
    z-index: -1;
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

#ordersContainer {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
    gap: 20px;
}

.order-card {
    background: rgba(12, 9, 0, 0.321);
    backdrop-filter: blur(15px);
    padding: 16px;
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(255, 221, 2, 0.596);
    transition: transform 0.3s, box-shadow 0.3s;
    cursor: pointer;
}

.order-card:hover {
    transform: translateY(-6px) scale(1.03);
    box-shadow: 0 10px 40px rgba(253, 232, 1, 0.987);
}

.order-card h3 {
    margin-bottom: 5px;
    color: #fff;
}

.order-card p {
    margin: 2px 0;
    font-size: 14px;
    color: #cfcfcf;
}

.order-card .price {
    color: #fafcfd;
    font-weight: bold;
}

.order-card .status {
    margin-top: 6px;
    padding: 4px 8px;
    color: #ffffff;
    border-radius: 6px;
    display: inline-block;
    width: max-content;
}

.back-btn {
    display: flex;
    justify-content: center;
    margin-top: 30px;
}

.back-btn a {
    background: #fccf03cb;
    padding: 10px 18px;
    color: rgb(8, 0, 9);
    text-decoration: none;
    border-radius: 10px;
}
.back-btn {
  display:flex;
  justify-content:center;
  margin-top:30px;
}
.back-btn a {
  background: linear-gradient(90deg, #2b2b2b, #1a1a1a);
  padding:12px 22px;
  color:#ffd700;
  text-decoration:none;
  border-radius:12px;
  font-weight:bold;
  transition:0.3s;
}
.back-btn a:hover {
  background: linear-gradient(90deg, #3d2bd7, #7c3aed);
  box-shadow: 0 0 12px #ffd700;
}
</style>
</head>
<body>

<div id="ordersSection">
  <h2>سفارشات مشتریان</h2>
  <div id="ordersContainer"></div>
  <div class="back-btn">
    <a href="./dashboard.html">بازگشت</a>
  </div>
</div>

<script>
const orders = [
  {id:'#001', name:'علی رضایی', products:'محصول 1, محصول 3', price:'1,200,000 تومان', status:'پرداخت شده'},
  {id:'#002', name:'سارا محمدی', products:'محصول 2', price:'850,000 تومان', status:'در انتظار پرداخت'},
  {id:'#003', name:'مهدی حسینی', products:'محصول 4, محصول 5', price:'2,300,000 تومان', status:'ارسال شده'},
  {id:'#004', name:'ناهید احمدی', products:'محصول 6', price:'1,100,000 تومان', status:'پرداخت شده'},
  {id:'#005', name:'رضا کریمی', products:'محصول 7, محصول 8', price:'1,950,000 تومان', status:'در انتظار پرداخت'}
];

function renderOrders(){
  const container = document.getElementById('ordersContainer');
  container.innerHTML = '';
  orders.forEach(order => {
    let statusColor = '';
    if(order.status==='پرداخت شده') statusColor = '#22c55e';
    else if(order.status==='در انتظار پرداخت') statusColor = '#f59e0b';
    else if(order.status==='ارسال شده') statusColor = '#3b82f6';
    
    const card = document.createElement('div');
    card.classList.add('order-card');
    card.style.borderLeft = `6px solid ${statusColor}`;
    card.innerHTML = `
      <h3>${order.name}</h3>
      <p><strong>شماره سفارش:</strong> ${order.id}</p>
      <p><strong>محصولات:</strong> ${order.products}</p>
      <p class="price">${order.price}</p>
      <p class="status" style="background:${statusColor}33">${order.status}</p>
    `;
    container.appendChild(card);
  });
}

renderOrders();
</script>

</body>
</html>
