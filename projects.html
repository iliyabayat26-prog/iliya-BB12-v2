<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پروژه‌ها</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn';}

body {
  direction: rtl;
  min-height: 100vh;
  background: linear-gradient(-45deg, #1a1a1a, #2c3e50, #34495e, #1a1a1a);
  color: #ffd700;
  overflow-x: hidden;
  padding: 40px 20px;
  position: relative;
}


#particles-js {
  position: fixed;
  width: 100%;
  height: 100vh;
  top: 0;
  left: 0;
  z-index: -2;
}


body::before {
  /* content:"helllllsfsdffs"; */
  position: fixed; top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.7);
  z-index: -1;
}

h1 {
  text-align: center;
  margin-bottom: 40px;
  font-size: 2.5rem;
  background: linear-gradient(135deg,#d4af37,#f6e27a);
  -webkit-text-fill-color: transparent;
  text-shadow: 0 2px 6px rgba(0,0,0,0.8);
}

.container {
  max-width: 1200px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 25px;
}


.project-card {
  background: rgba(24, 0, 0, 0.45);
  backdrop-filter: blur(20px);
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 8px 30px rgba(212, 175, 55, 0.7);
  transition: transform 0.5s, box-shadow 0.5s;
  cursor: pointer;
  opacity: 0;
  transform: translateY(30px);
  animation: fadeInUp 0.6s forwards;
}

.project-card:nth-child(1) { animation-delay: 0.1s; }
.project-card:nth-child(2) { animation-delay: 0.2s; }
.project-card:nth-child(3) { animation-delay: 0.3s; }
.project-card:nth-child(4) { animation-delay: 0.4s; }

.project-card:hover {
  transform: translateY(-8px) scale(1.04);
  box-shadow: 0 15px 50px rgba(212, 175, 55, 0.9);
}

.project-card img {
  width: 100%;
  height: 150px;
  object-fit: cover;
  border-radius: 12px;
  margin-bottom: 12px;
}

.project-card h3 {
  font-size: 20px;
  margin-bottom: 8px;
  color: #fff;
}

.project-card p {
  font-size: 14px;
  color: #fff8b5;
}

.project-card .price {
  font-weight: bold;
  color: #ffd700;
  margin-top: 10px;
  font-size: 16px;
}

.vote-box { 
  margin-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px; 
}

.vote-box input[type="text"] { 
  padding: 8px;
  border-radius: 8px; 
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.03); 
  color: white; 
}

.vote-box button { 
  background: #ffd700e3;
  color: black;
  border: none; border-radius: 8px;
  padding: 6px 12px; 
  cursor: pointer; transition: 0.2s; 
}

.vote-box button:hover { 
  background: #f5d000aa; 
}

.comments { 
  margin-top: 8px;
  font-size: 13px;
  color: #fff8b5;
  max-height: 120px;
  overflow-y: auto; 
}

.back-btn { 
  display:flex;
  justify-content:center;
  margin-top:30px;
}

.back-btn a {
  background: linear-gradient(90deg, #2b2b2b, #1a1a1a);
  padding:12px 22px;
  color:#ffd700;
  text-decoration:none;
  border-radius:12px;
  font-weight:bold;
  transition:0.3s;
}

.back-btn a:hover {
  background: linear-gradient(90deg, #3d2bd7, #7c3aed);
  box-shadow: 0 0 12px #ffd700;
}

@keyframes fadeInUp {
  0% { opacity: 0; transform: translateY(30px);}
  100% { opacity: 1; transform: translateY(0);}
}
</style>
</head>
<body>

<!-- پس‌زمینه ذرات -->
<div id="particles-js"></div>

<h1></h1>

<div class="container" id="projectsContainer">

    <div class="project-card" data-project="project1">
        <img src="https://img2.taw-bio.ir/2025/301209/thumbs/450x1740044576.jpeg" alt="پروژه ۱">
        <h3>دستکش اول</h3>
        <p>توضیحات کوتاه درباره پروژه اول</p>
        <p class="price">قیمت: 1,200,000 تومان</p>
        <div class="vote-box">
            <input type="text" placeholder="نظر خود را بنویسید"> 
            <button>ثبت نظر</button>
        </div>
        <div class="comments"></div>
    </div>

    <div class="project-card" data-project="project2">
        <img src="https://img2.taw-bio.ir/2025/301209/thumbs/450x1740044576.jpeg" alt="پروژه ۲">
        <h3>دستکش دوم</h3>
        <p>توضیحات کوتاه درباره پروژه دوم</p>
        <p class="price">قیمت: 980,000 تومان</p>
        <div class="vote-box">
            <input type="text" placeholder="نظر خود را بنویسید">
            <button>ثبت نظر</button>
        </div>
        <div class="comments"></div>
    </div>

</div>

<div class="back-btn">
    <a href="./Untitled-1.html">بازگشت به صفحه اصلی</a>
</div>

<!-- Particles.js -->
<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
particlesJS("particles-js", {
  "particles": {
    "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
    "color": { "value": "#ffd700" },
    "shape": { "type": "circle" },
    "opacity": { "value": 0.5 },
    "size": { "value": 3, "random": true },
    "line_linked": {
      "enable": true,
      "distance": 150,
      "color": "#ffd700",
      "opacity": 0.4,
      "width": 1
    },
    "move": { "enable": true, "speed": 2, "out_mode": "out" }
  },
  "interactivity": {
    "detect_on": "canvas",
    "events": {
      "onhover": { "enable": true, "mode": "repulse" },
      "onclick": { "enable": true, "mode": "push" },
      "resize": true
    },
    "modes": {
      "repulse": { "distance": 100, "duration": 0.4 },
      "push": { "particles_nb": 4 }
    }
  },
  "retina_detect": true
});
</script>

<!-- ذخیره و نمایش نظرات -->
<script>
window.onload = () => {
    document.querySelectorAll(".project-card").forEach(card => {
        const project = card.getAttribute("data-project");
        const stored = JSON.parse(localStorage.getItem("project_" + project)) || [];
        const commentsDiv = card.querySelector(".comments");
        stored.forEach(c => {
            const p = document.createElement("p");
            p.textContent = c;
            commentsDiv.appendChild(p);
        });

        const btn = card.querySelector("button");
        const input = card.querySelector("input");
        btn.addEventListener("click", () => {
            const text = input.value.trim();
            if(!text) return;
            const stored = JSON.parse(localStorage.getItem("project_" + project)) || [];
            stored.push(text);
            localStorage.setItem("project_" + project, JSON.stringify(stored));
            const p = document.createElement("p");
            p.textContent = text;
            commentsDiv.appendChild(p);
            input.value = "";
        });
    });
};
</script>

</body>
</html>
