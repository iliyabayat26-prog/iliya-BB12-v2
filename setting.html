<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تنظیمات سایت</title>
<link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.1/Vazirmatn-font-face.css" rel="stylesheet" />
<style>
:root {
    --accent: #3443986b;
    --accent2: #f4d003a8;
    --text: #fdcf05;
    --muted: #f7d308c9;
    --card: rgba(0, 0, 0, 0.874);
    --radius: 14px;
    --shadow: 0 10px 40px rgba(0,0,0,0.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
body {
    background-image: url('https://images.unsplash.com/photo-1506765515384-028b60a970df?auto=format&fit=crop&w=2000&q=100');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0, 0, 0, 0.746), rgba(0,0,0,0.65));
    z-index: 0;
}

.container * { position: relative; z-index: 2; }

.container {
    width: 100%;
    max-width: 700px;
    backdrop-filter: blur(20px);
    background: rgba(0, 0, 0, 0.722);
    padding: 35px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid rgba(255,255,255,0.15);
    animation: fadeIn 0.9s ease forwards;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}

h2 {
    text-align: center;
    margin-bottom: 25px;
    color: var(--text);
}

label {
    display: block;
    margin-bottom: 6px;
    font-size: 15px;
    color: var(--muted);
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: #fab405cf;
    font-size: 14px;
    margin-bottom: 18px;
    outline: none;
    transition: .2s;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent2); }

.btn {
    width: 100%;
    background: var(--accent2);
    padding: 12px;
    border-radius: var(--radius);
    border: none;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
    font-size: 16px;
}
.btn:hover { background: #f8cf03bd; transform: translateY(-2px); }

.back-btn a {
  background: linear-gradient(90deg, #2b2b2b, #1a1a1a);
  padding:12px 22px;
  color:#ffd700;
  text-decoration:none;
  border-radius:12px;
  font-weight:bold;
  transition:0.3s;
}
.back-btn a:hover {
  background: linear-gradient(90deg, #3d2bd7, #7c3aed);
  box-shadow: 0 0 12px #0a0902;
}
</style>
</head>
<body>

<div class="container">
    <h2>تنظیمات سایت</h2>

    <label>نام سایت</label>
    <input type="text" placeholder="مثال: سایت من" />

    <label>رنگ اصلی سایت</label>
    <input type="color" />

    <label>توضیحات سایت</label>
    <textarea rows="4" placeholder="توضیحات سایت را وارد کنید..."></textarea>

    <label>انتخاب زبان</label>
    <select>
        <option>فارسی</option>
        <option>English</option>
        <option>Arabic</option>
    </select>

    <button class="btn">ذخیره تنظیمات</button>

    <div id="ordersSection">
        <div id="ordersContainer"></div>
        <div class="back-btn">
            <br>
            <a href="./dashboard.html">بازگشت</a>
        </div>
    </div>
</div>

</body>
</html>
