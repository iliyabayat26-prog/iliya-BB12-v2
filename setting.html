<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تنظیمات سایت</title>
<link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.1/Vazirmatn-font-face.css" rel="stylesheet" />
<style>
:root {
    --accent: #3443986b;
    --accent2: #ffd700c9; /* طلایی */
    --text: #ffd700;
    --muted: #fff1a1;
    --card: rgba(0, 0, 0, 0.874);
    --radius: 14px;
    --shadow: 0 10px 40px rgba(0,0,0,0.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }

body {
     background: linear-gradient(-45deg, #1a1a1a, #2c3e50, #34495e, #1a1a1a);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    position: relative;
    overflow555555555555
    : hidden;
}

@keyframes gradientBG {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}


#particles-js {
  position: fixed;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  z-index: -2;
}


body::before {
    
    position: fixed; top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.7);
    z-index: -1;
}

.container * { position: relative; z-index: 2; }

.container {
    width: 100%;
    max-width: 700px;
    backdrop-filter: blur(20px);
    background: rgba(0, 0, 0, 0.45);
    padding: 35px;
    border-radius: var(--radius);
    box-shadow: 0 10px 40px rgba(212,175,55,0.6);
    border: 1px solid rgba(255,255,255,0.15);
    animation: fadeIn 0.9s ease forwards;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}

h2 { text-align: center; 
  margin-bottom: 25px; 
  color: var(--text);
   text-shadow: 0 2px 6px rgba(0,0,0,0.7); }

label { display: block;
   margin-bottom: 6px; 
  font-size: 15px;
   color: var(--muted); }

input, select, textarea {
    width: 100%;
     padding: 12px;
     border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.03);
     color: #ffd700cc; 
    font-size: 14px;
    margin-bottom: 18px;
     outline: none; 
    transition: .2s;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent2); }

.btn {
    width: 100%; background: var(--accent2);
justify-content: center;
     padding: 12px;
     border-radius: var(--radius);
    border: none;
     color: #000; font-weight: bold;
     cursor: pointer;
     transition: .3s; 
    font-size: 16px;
    
}
.btn:hover { background: #fbe04d;
   transform: translateY(-2px); }

.back-btn a {
   display: flex;
  justify-content: center;
  background: linear-gradient(90deg, #2b2b2b, #1a1a1a);
  padding:12px 22px;
   color:#ffd700; text-decoration:none;
   border-radius:12px;
  font-weight:bold; transition:0.3s;
}
.back-btn a:hover {
  background: linear-gradient(90deg, #eab508, #120823);
  box-shadow: 0 0 12px #ffd700;
}
</style>
</head>
<body>


<div id="particles-js"></div>

<div class="container">
    <h2>تنظیمات سایت</h2>

    <label>نام سایت</label>
    <input type="text" placeholder="مثال: سایت من" />

    <label>رنگ اصلی سایت</label>
    <input type="color" />

    <label>توضیحات سایت</label>
    <textarea rows="4" placeholder="توضیحات سایت را وارد کنید..."></textarea>

    <label>انتخاب زبان</label>
    <select>
        <option>فارسی</option>
        <option>English</option>
        <option>Arabic</option>
    </select>

    <button class="btn">ذخیره تنظیمات</button>

    <div class="back-btn">
        <br>
        <a href="./dashboard.html">بازگشت</a>
    </div>
</div>

<!-- Particles.js -->
<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
particlesJS("particles-js", {
  "particles": {
    "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
    "color": { "value": "#ffd700" },
    "shape": { "type": "circle" },
    "opacity": { "value": 0.5 },
    "size": { "value": 3, "random": true },
    "line_linked": { "enable": true, "distance": 150, "color": "#ffd700", "opacity": 0.4, "width": 1 },
    "move": { "enable": true, "speed": 2, "out_mode": "out" }
  },
  "interactivity": {
    "detect_on": "canvas",
    "events": { "onhover": { "enable": true, "mode": "repulse" }, "onclick": { "enable": true, "mode": "push" }, "resize": true },
    "modes": { "repulse": { "distance": 100, "duration": 0.4 }, "push": { "particles_nb": 4 } }
  },
  "retina_detect": true
});
</script>

</body>
</html>
