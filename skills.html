<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مهارت‌ها</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: "Vazirmatn", sans-serif;
    direction: rtl;
    min-height: 100vh;
    color: #ffd700;
    padding: 2px 10px;
    position: relative;
     background: linear-gradient(-45deg, #1a1a1a, #2c3e50, #34495e, #1a1a1a);
    background-size: 900% 400%;
    animation: gradientBG 15s ease infinite;
    overflow-x: hidden;
}

@keyframes gradientBG {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}


#particles-js {
  position: fixed;
  width: 100%;
  height: 100vh;
  top: 0;
  left: 0;
  z-index: -2;
}
body::before {
  
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: -1;
}

h1 { 
    text-align: center; 
    margin-bottom: 30px; 
    font-size: 28px; 
    color: #ffd700;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);
}

.container {
    max-width: 1100px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
}

.skill-card {
    background: rgba(12, 10, 0, 0.5);
    backdrop-filter: blur(15px);
    padding: 22px;
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(255, 215, 0, 0.6);
    transition: transform 0.3s, box-shadow 0.3s;
    cursor: pointer;
}

.skill-card:hover {
    transform: translateY(-6px) scale(1.03);
    box-shadow: 0 10px 40px rgba(255, 215, 0, 0.4);
}

.skill-card h3 {
    margin: 0;
    font-size: 20px;
    color: #fff;
}

.bar {
    margin-top: 14px;
    width: 100%;
    background: rgba(255,215,0,0.2);
    height: 10px;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
}
.bar span {
    display: block;
    height: 100%;
    border-radius: 10px;
    background: linear-gradient(90deg, #ffd700, #bfa000);
    width: 0;
    transition: width 1.4s ease;
}

.percent {
    margin-top: 8px;
    font-size: 13px;
    opacity: .9;
    color: #ffd700;
}

.vote-box { 
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.vote-box input[type="text"] { 
    padding: 8px;
    border-radius: 8px;
    border: 1px solid rgba(255, 215, 0, 0.6);
    background: rgba(255,255,255,0.03);
    color: #fff;
}
.vote-box button { 
    background: #ffd700c9;
    color: #000;
    border: none; 
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer; 
    transition: 0.2s; 
}
.vote-box button:hover { 
    background: #fff176; 
}

.comments { 
    margin-top: 8px;
    font-size: 13px;
    color: #ffd700;
    max-height: 120px;
    overflow-y: auto; 
}

.back-btn { 
    display: flex;
    justify-content: center; 
    margin-top: 30px; 
}
.back-btn a {
  background: linear-gradient(90deg, #2b2b2b, #1a1a1a);
  padding:12px 22px;
  color:#ffd700;
  text-decoration:none;
  border-radius:12px;
  font-weight:bold;
  transition:0.3s;
}
.back-btn a:hover {
  background: linear-gradient(90deg, #3d2bd7, #7c3aed);
  box-shadow: 0 0 12px #ffd700;
}
</style>
</head>

<body>


<div id="particles-js"></div>

<h1>مهارت‌ها</h1>

<div class="container" id="skillsContainer">

   
    <div class="skill-card" data-skill="HTML">
        <h3>HTML</h3>
        <div class="bar"><span data-percent="95%"></span></div>
        <div class="percent">95%</div>
        <div class="vote-box">
            <input type="text" placeholder="نظر خود را بنویسید">
            <button>ثبت نظر</button>
        </div>
        <div class="comments"></div>
    </div>

    <div class="skill-card" data-skill="CSS">
        <h3>CSS</h3>
        <div class="bar"><span data-percent="90%"></span></div>
        <div class="percent">90%</div>
        <div class="vote-box">
            <input type="text" placeholder="نظر خود را بنویسید">
            <button>ثبت نظر</button>
        </div>
        <div class="comments"></div>
    </div>

    <div class="skill-card" data-skill="UI/UX">
        <h3>UI/UX</h3>
        <div class="bar"><span data-percent="94%"></span></div>
        <div class="percent">94%</div>
        <div class="vote-box">
            <input type="text" placeholder="نظر خود را بنویسید">
            <button>ثبت نظر</button>
        </div>
        <div class="comments"></div>
    </div>

    <div class="skill-card" data-skill="Node.js">
        <h3>Node.js</h3>
        <div class="bar"><span data-percent="91%"></span></div>
        <div class="percent">91%</div>
        <div class="vote-box">
            <input type="text" placeholder="نظر خود را بنویسید">
            <button>ثبت نظر</button>
        </div>
        <div class="comments"></div>
    </div>

    <div class="skill-card" data-skill="React">
        <h3>React</h3>
        <div class="bar"><span data-percent="97%"></span></div>
        <div class="percent">97%</div>
        <div class="vote-box">
            <input type="text" placeholder="نظر خود را بنویسید">
            <button>ثبت نظر</button>
        </div>
        <div class="comments"></div>
    </div>

</div>

<div class="back-btn">
    <a href="./untitled-1.html">بازگشت به صفحه اصلی</a>
</div>

<!-- Particles.js -->
<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
particlesJS("particles-js", {
  "particles": {
    "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
    "color": { "value": "#ffd700" },
    "shape": { "type": "circle" },
    "opacity": { "value": 0.5 },
    "size": { "value": 3, "random": true },
    "line_linked": {
      "enable": true,
      "distance": 150,
      "color": "#ffd700",
      "opacity": 0.4,
      "width": 1
    },
    "move": { "enable": true, "speed": 2, "out_mode": "out" }
  },
  "interactivity": {
    "detect_on": "canvas",
    "events": {
      "onhover": { "enable": true, "mode": "repulse" },
      "onclick": { "enable": true, "mode": "push" },
      "resize": true
    },
    "modes": {
      "repulse": { "distance": 100, "duration": 0.4 },
      "push": { "particles_nb": 4 }
    }
  },
  "retina_detect": true
});
</script>

<script>
window.onload = () => {
    document.querySelectorAll(".bar span").forEach(bar => {
        bar.style.width = bar.getAttribute("data-percent");
    });

    document.querySelectorAll(".skill-card").forEach(card => {
        const skill = card.getAttribute("data-skill");
        const stored = JSON.parse(localStorage.getItem("skill_" + skill)) || [];
        const commentsDiv = card.querySelector(".comments");
        stored.forEach(c => {
            const p = document.createElement("p");
            p.textContent = c;
            commentsDiv.appendChild(p);
        });

        const btn = card.querySelector("button");
        const input = card.querySelector("input");

        btn.addEventListener("click", () => {
            const text = input.value.trim();
            if(!text) return;
            stored.push(text);
            localStorage.setItem("skill_" + skill, JSON.stringify(stored));

            const p = document.createElement("p");
            p.textContent = text;
            commentsDiv.appendChild(p);

            input.value = "";
        });
    });
};
</script>

</body>
</html>
