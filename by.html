<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ثبت سفارش فروشگاه — ایلیا بیات</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
/* --- Reset & Base --- */
* { box-sizing: border-box; margin:0; padding:0; }
body {
    margin: 0;
    font-family: "Vazirmatn", sans-serif;
    direction: rtl;
    min-height: 100vh;
     background: linear-gradient(-45deg, #1a1a1a, #2c3e50, #34495e, #1a1a1a);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    color: #ffd700;
    padding: 40px 20px;
    position: relative;
    
}
body::before {
   
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0, 0, 0, 0.7);
    z-index: -1;
}

/* --- Particles container --- */
#particles-js {
    position: fixed;
    top:0; left:0;
    width:100%;
    height:100%;
    z-index: -2;
}

/* --- Title --- */
h1 {
    text-align: center;
    font-size: 2.2rem;
    margin-bottom: 30px;
    text-shadow: 0 2px 6px rgba(255, 215, 0, 0.9);
}

/* --- Form --- */
form {
    max-width: 700px;
    margin: 0 auto 40px;
    padding: 25px 30px;
    border-radius: 15px;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(15px);
    box-shadow: 0 10px 40px rgba(255, 215, 0, 0.5);
    transition: 0.3s ease;
}
form:hover { transform: translateY(-3px); }

input[type="text"], input[type="tel"], button {
    width: 100%;
    padding: 12px 15px;
    margin-top: 12px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
}
input[type="text"], input[type="tel"] {
    background: rgba(21, 21, 19, 0);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
}
input::placeholder { color: #eee; }
button[type="submit"] {
    background: #ffd7007a;
    color: #000;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s ease;
    border-radius: 10px;
    margin-top: 20px;
}
button[type="submit"]:hover { background: #f7e304; }

/* --- Product List --- */
.product-list { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 15px; }
.product-item {
    flex: 1 1 45%;
    display: flex;
    align-items: center;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(73, 65, 32, 0.8);
    backdrop-filter: blur(15px);
    cursor: pointer;
    transition: 0.3s ease;
}
.product-item:hover { transform: translateY(-2px); background: rgba(255,255,255,0.2); }
.product-item input { margin-left: 10px; }

/* --- Orders List --- */
.order-list {
    max-width: 700px;
    margin: 0 auto 40px;
}
.order-item {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    padding: 15px 20px;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    transition: 0.3s ease;
}
.order-item:hover { transform: translateY(-2px); background: rgba(255,255,255,0.18); }
.order-item p { margin: 5px 0; }

/* --- Back Button --- */
.back-btn { display: flex; justify-content: center; margin-bottom: 30px; }
.back-btn a {
   background: linear-gradient(-45deg, #d8b713, #5d5312, #3d3c38, #1a1a1a);
    padding:12px 22px;
    color:#ffd700;
    text-decoration:none;
    border-radius:12px;
    font-weight:bold;
    transition:0.3s;
}
.back-btn a:hover {
    background: linear-gradient(90deg, #3d2bd7, #7c3aed);
    box-shadow: 0 0 12px #ffd700;
}

/* --- Responsive --- */
@media (max-width: 768px) { .product-item { flex: 1 1 100%; } }
</style>
</head>
<body>

<!-- Particles container -->
<div id="particles-js"></div>

<h1>ثبت سفارش سایت</h1>

<form id="orderForm">
    <input type="text" id="customerName" placeholder="نام شما" required>
    <input type="tel" id="customerPhone" placeholder="شماره همراه" required>

    <h3>محصولات سایت:</h3>
    <div class="product-list" id="productList"></div>

    <button type="submit">ثبت سفارش</button>
</form>

<div class="order-list" id="orderList">
    <p style="text-align:center; color:#ccc;">هیچ سفارشی ثبت نشده است.</p>
</div>

<div class="back-btn">
    <a href="./dashboard.html">بازگشت به صفحه اصلی</a>
</div>

<!-- particles.js -->
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
<script>
// --- Golden particles ---
particlesJS("particles-js", {
  "particles": {
    "number": { "value": 100, "density": { "enable": true, "value_area": 800 } },
    "color": { "value": "#ffd700" },
    "shape": { "type": "circle" },
    "opacity": { "value": 0.9, "random": true },
    "size": { "value": 3, "random": true },
    "line_linked": {
      "enable": true,
      "distance": 150,
      "color": "#ffd700",
      "opacity": 0.5,
      "width": 1
    },
    "move": { "enable": true, "speed": 2, "direction": "none", "out_mode": "out" }
  },
  "interactivity": {
    "events": {
      "onhover": { "enable": true, "mode": "repulse" },
      "onclick": { "enable": true, "mode": "push" }
    },
    "modes": { "repulse": { "distance": 120 }, "push": { "particles_nb": 4 } }
  },
  "retina_detect": true
});
</script>

<script>
// --- Order logic ---
const products = [
   "طراحی سایت شرکتی",
   "طراحی سایت فروشگاهی",
   "سئو و بهینه‌سازی",
   "طراحی لوگو",
   "توسعه اپلیکیشن موبایل",
   "طراحی UI",
   "طراحی UX",
   "برندسازی دیجیتال",
   "بازاریابی شبکه‌های اجتماعی",
   "تولید محتوا",
   "هاستینگ و دامنه",
   "پشتیبانی سایت",
   "امنیت سایت",
   "تجزیه و تحلیل داده‌ها",
   "مشاوره دیجیتال",
   "بازاریابی ایمیلی",
];
const productListDiv = document.getElementById('productList');
products.forEach((product,index)=>{
  const div=document.createElement('div');
  div.className='product-item';
  div.innerHTML=`<input type="checkbox" name="product" value="${product}" id="product${index}"><label for="product${index}" style="color:#fff;">${product}</label>`;
  productListDiv.appendChild(div);
});

let orders = JSON.parse(localStorage.getItem('orders')) || [];
function displayOrders(){
  const orderList = document.getElementById('orderList');
  if(orders.length===0){
    orderList.innerHTML='<p style="text-align:center; color:#ccc;">هیچ سفارشی ثبت نشده است.</p>';
    return;
  }
  orderList.innerHTML='';
  orders.forEach(order=>{
    const div=document.createElement('div');
    div.className='order-item';
    div.innerHTML=`<p><strong>نام:</strong> ${order.name}</p>
                   <p><strong>شماره همراه:</strong> ${order.phone}</p>
                   <p><strong>محصولات انتخاب شده:</strong> ${order.products.join(', ')}</p>`;
    orderList.appendChild(div);
  });
}
document.getElementById('orderForm').addEventListener('submit',function(e){
  e.preventDefault();
  const name = document.getElementById('customerName').value;
  const phone = document.getElementById('customerPhone').value;
  const selectedProducts = Array.from(document.querySelectorAll('input[name="product"]:checked')).map(el=>el.value);
  if(selectedProducts.length===0){ alert("لطفاً حداقل یک محصول را انتخاب کنید!"); return; }
  orders.push({name, phone, products: selectedProducts});
  localStorage.setItem('orders', JSON.stringify(orders));
  this.reset();
  displayOrders();
});
displayOrders();
</script>

</body>
</html>
