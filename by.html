<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>ثبت سفارش فروشگاه</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== Reset & Base ===== */
* { box-sizing: border-box; margin:0; padding:0; }
body {
    font-family: 'Vazirmatn', sans-serif;
    direction: rtl;
    background: #0a0a0a url('https://images.unsplash.com/photo-1506765515384-028b60a970df?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat fixed;
    color: #fff;
    min-height: 100vh;
    position: relative;
}
body::before {
    content:"";
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.7);
    z-index:-1;
}
h1 {
    text-align:center;
    font-size:2.5rem;
    margin-bottom:30px;
    background: linear-gradient(135deg,#d4af37,#f6e27a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 2px 6px rgba(0,0,0,0.8);
}

/* ===== Form ===== */
form {
    max-width:700px;
    margin: 0 auto 40px;
    padding:30px;
    border-radius:20px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(15px);
    box-shadow: 0 10px 40px rgba(212,175,55,0.3);
    transition: 0.3s ease;
}
form:hover { box-shadow: 0 12px 50px rgba(212,175,55,0.5); transform:translateY(-3px); }

input[type="text"], input[type="tel"] {
    width:100%;
    padding:12px 15px;
    margin-top:12px;
    border-radius:12px;
    border: 1px solid rgba(212,175,55,0.3);
    background: rgba(255,255,255,0.05);
    color:#fff;
}
input::placeholder { color:#d4d4d4; }

button[type="submit"] {
    width:100%;
    padding:12px 15px;
    margin-top:20px;
    border:none;
    border-radius:12px;
    font-weight:bold;
    background: linear-gradient(135deg,#d4af37,#f6e27a);
    color:#0a0a0a;
    cursor:pointer;
    transition:0.3s ease;
}
button[type="submit"]:hover { opacity:0.85; transform: translateY(-2px); }

/* ===== Product List ===== */
.product-list {
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:15px;
}
.product-item {
    flex:1 1 45%;
    display:flex;
    align-items:center;
    padding:12px;
    border-radius:15px;
    background: rgba(255,255,255,0.03);
    border:1px solid rgba(212,175,55,0.2);
    cursor:pointer;
    transition:0.3s ease, box-shadow 0.3s ease;
}
.product-item:hover {
    transform: translateY(-3px);
    box-shadow: 0 4px 20px rgba(212,175,55,0.5);
    background: rgba(255,255,255,0.08);
}
.product-item input { margin-left:10px; }

/* ===== Orders List ===== */
.order-list {
    max-width:700px;
    margin:0 auto 40px;
}
.order-item {
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    padding:15px 20px;
    border-radius:15px;
    margin-bottom:15px;
    border:1px solid rgba(212,175,55,0.2);
    box-shadow: 0 4px 20px rgba(212,175,55,0.3);
    transition:0.3s ease;
}
.order-item:hover {
    transform: translateY(-2px);
    box-shadow:0 6px 25px rgba(212,175,55,0.6);
}
.order-item p { margin:5px 0; }

/* ===== Back Button ===== */
.back-btn { display:flex; justify-content:center; margin-bottom:30px; }
.back-btn a {
    background: linear-gradient(135deg,#d4af37,#f6e27a);
    color:#0a0a0a;
    padding:12px 25px;
    text-decoration:none;
    border-radius:15px;
    font-weight:bold;
    transition:0.3s ease;
}
.back-btn a:hover { opacity:0.9; transform:translateY(-2px); }

/* ===== Responsive ===== */
@media (max-width:768px) {
    .product-item { flex:1 1 100%; }
}
.back-btn a {
  background: linear-gradient(90deg, #2b2b2b, #1a1a1a);
  padding:12px 22px;
  color:#ffd700;
  text-decoration:none;
  border-radius:12px;
  font-weight:bold;
  transition:0.3s;
}
.back-btn a:hover {
  background: linear-gradient(90deg, #3d2bd7, #7c3aed);
  box-shadow: 0 0 12px #ffd700;
}

</style>
</head>
<body>

<h1>ثبت سفارش سایت</h1>

<form id="orderForm">
    <input type="text" id="customerName" placeholder="نام شما" required>
    <input type="tel" id="customerPhone" placeholder="شماره همراه" required>

    <h3>محصولات سایت:</h3>
    <div class="product-list" id="productList"></div>

    <button type="submit">ثبت سفارش</button>
</form>

<div class="order-list" id="orderList">
    <p style="text-align:center; color:#ccc;">هیچ سفارشی ثبت نشده است.</p>
</div>

<div class="back-btn">
    <a href="./dashboard.html">بازگشت به صفحه اصلی</a>
</div>

<script>
// لیست محصولات سایت
const products = [
   "طراحی سایت شرکتی",
   "طراحی سایت فروشگاهی",
   "سئو و بهینه‌سازی",
   "طراحی لوگو",
   "توسعه اپلیکیشن موبایل",
   "طراحی رابط کاربری (UI)",
   "طراحی تجربه کاربری (UX)",
   "برندسازی دیجیتال",
   "بازاریابی شبکه‌های اجتماعی",
   "تولید محتوا",
   "هاستینگ و دامنه",
   "پشتیبانی سایت",
   "امنیت سایت",
   "تجزیه و تحلیل داده‌ها",
   "مشاوره دیجیتال",
   "بازاریابی ایمیلی",
]
const productListDiv = document.getElementById('productList');

products.forEach((product, index) => {
    const div = document.createElement('div');
    div.className = 'product-item';
    div.innerHTML = `<input type="checkbox" name="product" value="${product}" id="product${index}"><label for="product${index}" style="color:#fff;">${product}</label>`;
    productListDiv.appendChild(div);
});

let orders = JSON.parse(localStorage.getItem('orders')) || [];

function displayOrders() {
    const orderList = document.getElementById('orderList');
    if (orders.length === 0) {
        orderList.innerHTML = '<p style="text-align:center; color:#ccc;">هیچ سفارشی ثبت نشده است.</p>';
        return;
    }
    orderList.innerHTML = '';
    orders.forEach((order,index) => {
        const div = document.createElement('div');
        div.className = 'order-item';
        div.innerHTML = `
            <p><strong>نام:</strong> ${order.name}</p>
            <p><strong>شماره همراه:</strong> ${order.phone}</p>
            <p><strong>محصولات انتخاب شده:</strong> ${order.products.join(', ')}</p>
        `;
        orderList.appendChild(div);
    });
}
document.getElementById('orderForm').addEventListener('submit', function(e){
    e.preventDefault();
    const name = document.getElementById('customerName').value;
    const phone = document.getElementById('customerPhone').value;
    const selectedProducts = Array.from(document.querySelectorAll('input[name="product"]:checked')).map(el => el.value);
    if(selectedProducts.length === 0){
        alert("لطفاً حداقل یک محصول را انتخاب کنید!");
        return;
    }
    orders.push({name, phone, products: selectedProducts});
    localStorage.setItem('orders', JSON.stringify(orders));
    this.reset();
    displayOrders();
});

displayOrders();
</script>

</body>
</html>
