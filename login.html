
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود به حساب</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/shabnam-font/dist/font-face.css">
<link rel="stylesheet" href="../fonts/Vazirmatn-font-face.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn';}

body {
  direction:rtl;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  position:relative;
  overflow:hidden;

 
   background: linear-gradient(-45deg, #1a1a1a, #2c3e50, #34495e, #1a1a1a);
  background-size:400% 400%;
  animation: bgMove 15s ease infinite;
}

@keyframes bgMove {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}


body::before {

  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.7);
  z-index:-1;
}


#particles-js {
  position:fixed;
  width:100%; height:100%;
  top:0; left:0;
  z-index:-2;
}

.container {
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(20px);
  padding: 35px 30px;
  border-radius:25px;
  box-shadow:0 10px 40px rgba(0,0,0,0.7);
  width:360px;
  color:#fff;
  text-align:center;
}

h2 {
  margin-bottom:25px;
  font-weight:700;
  font-size:1.8rem;
  color:#ffd700;
  text-shadow: 1px 1px 6px #000;
}

input {
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  margin-bottom:15px;
  background: rgba(255,255,255,0.1);
  color:#fff;
  font-size:1rem;
}
input::placeholder {color:#ddd;}

button {
  width:100%;
  padding:14px;
  border:none;
  border-radius:15px;
  background: linear-gradient(90deg,#7c3aed,#2b2bd7);
  color:#ffd700;
  font-size:1rem;
  cursor:pointer;
  font-weight:bold;
  transition:0.3s;
}
button:hover {
  background: linear-gradient(90deg,#2b2bd7,#7c3aed);
  box-shadow:0 0 15px #ffd700;
}

a {color:#ffd700; text-decoration:none; font-size:0.95rem;}
a:hover {text-decoration:underline;}

.register-link {margin-top:15px;}

.error {
  color:#ff8080;
  font-size:0.85rem;
  margin-bottom:10px;
  display:none;
  text-align:right;
}
</style>
</head>
<body>

<div id="particles-js"></div>

<div class="container">
  <h2>ورود به حساب</h2>

  <div class="error" id="errorMsg">لطفاً ایمیل و رمز عبور را وارد کنید.</div>

  <input type="text" id="email" placeholder="ایمیل یا نام کاربری">
  <input type="password" id="password" placeholder="رمز عبور">

  <button onclick="loginUser()">ورود</button>

  <p class="register-link">حساب ندارید؟ <a href="register.html">ثبت نام</a></p>
</div>

<!-- particles.js -->
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

<script>
function loginUser(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');

  if(!email || !password){
    errorMsg.style.display = 'block';
  } else {
    errorMsg.style.display = 'none';
    window.location.href = 'dashboard.html';
  }
}

particlesJS("particles-js", {
  "particles": {
    "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
    "color": { "value": "#ffd700" },
    "shape": { "type": "circle" },
    "opacity": { "value": 0.5 },
    "size": { "value": 3, "random": true },
    "line_linked": { "enable": true, "distance": 150, "color": "#ffd700", "opacity": 0.4, "width": 1 },
    "move": { "enable": true, "speed": 2, "out_mode": "out" }
  },
  "interactivity": {
    "events": { "onhover": { "enable": true, "mode": "repulse" } }
  },
  "retina_detect": true
});
</script>

</body>
</html>
