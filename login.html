
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود به حساب</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/shabnam-font/dist/font-face.css">
<link rel="stylesheet" href="../fonts/Vazirmatn-font-face.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn';}

body {
  direction:rtl;
  background:url('https://images.unsplash.com/photo-1506765515384-028b60a970df?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat fixed;
  display:flex; justify-content:center; align-items:center; height:100vh; padding:20px;
}

body::before {
  content:"";
  position:fixed; top:0; left:0; width:100%; height:100%;
  background: rgba(0,0,0,0.65);
  z-index:-1;
}

.container {
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(20px);
  padding: 35px 30px;
  border-radius:25px;
  box-shadow:0 10px 40px rgba(0,0,0,0.7);
  width:360px;
  color:#fff;
  text-align:center;
}

h2 {
  margin-bottom:25px;
  font-weight:700;
  font-size:1.8rem;
  color:#ffd700;
  text-shadow: 1px 1px 6px #000;
}

input {
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  margin-bottom:15px;
  background: rgba(255,255,255,0.1);
  color:#fff;
  font-size:1rem;
  backdrop-filter: blur(10px);
}
input::placeholder {color:#ddd;}

button {
  width:100%;
  padding:14px;
  border:none;
  border-radius:15px;
  background: linear-gradient(90deg,#7c3aed,#2b2bd7);
  color:#ffd700;
  font-size:1rem;
  cursor:pointer;
  font-weight:bold;
  transition:0.3s;
}
button:hover {
  background: linear-gradient(90deg,#2b2bd7,#7c3aed);
  box-shadow:0 0 15px #ffd700;
}

a {color:#ffd700; text-decoration:none; font-size:0.95rem;}
a:hover {text-decoration:underline;}

.register-link {margin-top:15px;}
.error {
  color:#ff8080;
  font-size:0.85rem;
  margin-bottom:10px;
  display:none;
  text-align:right;
}
.back-btn a {
  background: linear-gradient(90deg, #2b2b2b, #1a1a1a);
  padding:12px 22px;
  color:#ffd700;
  text-decoration:none;
  border-radius:12px;
  font-weight:bold;
  transition:0.3s;
}
.back-btn a:hover {
  background: linear-gradient(90deg, #3d2bd7, #7c3aed);
  box-shadow: 0 0 12px #ffd700;
}
</style>
</head>
<body>

<div class="container">
  <h2>ورود به حساب</h2>

  <div class="error" id="errorMsg">لطفاً ایمیل و رمز عبور را وارد کنید.</div>

  <input type="text" id="email" placeholder="ایمیل یا نام کاربری">
  <input type="password" id="password" placeholder="رمز عبور">

  <button onclick="loginUser()">ورود</button>

  <p class="register-link">حساب ندارید؟ <a href="register.html">ثبت نام</a></p>
</div>

<script>
function loginUser(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');

  if(!email || !password){
    errorMsg.style.display = 'block';
  } else {
    errorMsg.style.display = 'none';
    window.location.href = 'dashboard.html';
  }
}
</script>

</body>
</html>
