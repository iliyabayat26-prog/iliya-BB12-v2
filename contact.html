<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ارتباط با ما — ایلیا بیات</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
<style>
body {
    margin:0;
    font-family: 'Vazirmatn', sans-serif;
    direction: rtl;
    min-height:100vh;
    background: #0a0a0a url('https://images.unsplash.com/photo-1506765515384-028b60a970df?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat fixed;
    color:#fff;
    padding: 40px 20px;
    position: relative;
}
body::before {
    content:"";
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.7);
    z-index:-1;
}

h1 {
    text-align:center;
    margin-bottom:40px;
    font-size:2.5rem;
    background: linear-gradient(135deg,#d4af37,#f6e27a);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow: 0 2px 6px rgba(0,0,0,0.8);
}

.container {
    max-width: 1100px;
    margin:auto;
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(260px,1fr));
    gap:25px;
}

.skill-card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);
    padding:25px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(212,175,55,0.3);
    transition:0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
}
.skill-card:hover {
    transform: translateY(-6px) scale(1.03);
    box-shadow: 0 12px 40px rgba(212,175,55,0.6);
}

.skill-card h3,
.skill-card h4 {
    margin:10px 0;
    font-weight:500;
    color: #fdf5e6;
}

.back-btn {
    display:flex;
    justify-content:center;
    margin-top:40px;
}

.back-btn a {
    background: linear-gradient(135deg,#d4af37,#f6e27a);
    padding:12px 25px;
    color:#0a0a0a;
    text-decoration:none;
    border-radius:15px;
    font-weight:bold;
    transition:0.3s ease;
}
.back-btn a:hover { opacity:0.9; transform:translateY(-2px); }

@media(max-width:768px){ .container{ grid-template-columns:1fr; } }
.back-btn a {
  background: linear-gradient(90deg, #2b2b2b, #1a1a1a);
  padding:12px 22px;
  color:#ffd700;
  text-decoration:none;
  border-radius:12px;
  font-weight:bold;
  transition:0.3s;
}
.back-btn a:hover {
  background: linear-gradient(90deg, #3d2bd7, #7c3aed);
  box-shadow: 0 0 12px #ffd700;
}
</style>
</head>
<body>

<h1>ارتباط با ما</h1>

<div class="container">
    <div class="skill-card">
        <h3>شماره تماس 1: 09383140049</h3>
        <h3>شماره تماس 2: 09113652814</h3>
    </div>

    <div class="skill-card">
        <h4>Email 1: iliyabayat26@gmail.com</h4>
        <h4>Email 2: iliyabayat24@gmail.com</h4>
    </div>
</div>

<div class="back-btn">
    <a href="./index.html">بازگشت به صفحه اصلی</a>
</div>

</body>
</html>
