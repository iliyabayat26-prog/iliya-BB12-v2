<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ارتباط با ما — ایلیا بیات</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  * {margin:0; padding:0; box-sizing:border-box; font-family:'Vazirmatn',sans-serif;}

  body {
    direction: rtl;
    min-height:100vh;
      background: linear-gradient(-45deg, #1a1a1a, #2c3e50, #34495e, #1a1a1a);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    color:#100000ad;
    padding: 40px 20px;
    position: relative;
    overflow: hidden;
  }

  @keyframes gradientBG {
    0% {background-position:0% 50%;}
    50% {background-position:100% 50%;}
    100% {background-position:0% 50%;}
  }

  #particles-js {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
  }

  h1 {
    text-align:center;
    margin-bottom:40px;
    font-size:2.5rem;
    background: linear-gradient(135deg,#d4af37,#120f00);
    -webkit-text-fill-color:transparent;
    text-shadow: 0 2px 6px rgba(245, 193, 4, 0.624);
  }

  .container {
    max-width: 1100px;
    margin:auto;
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(260px,1fr));
    gap:25px;
  }

  .skill-card {
    background: rgba(0, 0, 0, 0.24);
    backdrop-filter: blur(15px);
    padding:25px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(251, 193, 2, 0.621);
    transition:0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
  }
  .skill-card:hover {
    transform: translateY(-6px) scale(1.03);
    box-shadow: 0 12px 40px rgba(212, 175, 55, 0.67);
  }

  .skill-card h3,
  .skill-card h4 {
    margin:10px 0;
    font-weight:500;
    color: #fdf5e6;
  }

  .back-btn {
    display:flex;
    justify-content:center;
    margin-top:40px;
  }
  .back-btn a {
    background: linear-gradient(90deg, #2b2b2b, #1a1a1a);
    padding:12px 22px;
    color:#ffd700;
    text-decoration:none;
    border-radius:12px;
    font-weight:bold;
    transition:0.3s;
  }
  .back-btn a:hover {
    background: linear-gradient(90deg, #3d2bd7, #7c3aed);
    box-shadow: 0 0 12px #ffd700;
  }

  @media(max-width:768px){ .container{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<div id="particles-js"></div>

<h1></h1>

<div class="container">
    <div class="skill-card">
        <h3> 09383140049</h3>
        <h3>   09113652814</h3>
    </div>

    <div class="skill-card">
        <h4>Email 1: iliyabayat26@gmail.com</h4>
        <h4>Email 2: iliyabayat24@gmail.com</h4>
    </div>
</div>

<div class="back-btn">
    <a href="./untitled-1.html">بازگشت به صفحه اصلی</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
  particlesJS("particles-js", {
    "particles": {
      "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
      "color": { "value": "#ffd700" },
      "shape": { "type": "circle" },
      "opacity": { "value": 0.6 },
      "size": { "value": 3, "random": true },
      "line_linked": { "enable": true, "distance": 150, "color": "#ffd700", "opacity": 0.4, "width": 1 },
      "move": { "enable": true, "speed": 2, "direction": "none", "out_mode": "out" }
    },
    "interactivity": {
      "events": {
        "onhover": { "enable": true, "mode": "repulse" },
        "onclick": { "enable": true, "mode": "push" }
      },
      "modes": {
        "repulse": { "distance": 100 },
        "push": { "particles_nb": 4 }
      }
    },
    "retina_detect": true
  });
});
</script>

</body>
</html>
